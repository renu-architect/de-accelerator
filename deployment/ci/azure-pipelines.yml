# Azure DevOps pipeline for the CORE repo. Logic lives in scripts/ so other CI systems can reuse it.
trigger: { branches: { include: [main, release/*] } }
pr: { branches: { include: [main] } }
pool: { vmImage: ubuntu-latest }
stages:
  - stage: Verify
    jobs:
      - job: lint_type_test
        steps:
          - task: UsePythonVersion@0
            inputs: { versionSpec: '3.11' }   # keep in sync with config/runtime_matrix.yaml default profile
          - task: JavaToolInstaller@0
            inputs: { versionSpec: '17', jdkArchitectureOption: x64, jdkSourceOption: PreInstalled }
          - script: pip install -e ".[spark,dev]"
            displayName: Install
          - script: scripts/ci_test.sh
            displayName: Lint, type-check, test
          - task: PublishTestResults@2
            condition: always()
            inputs: { testResultsFiles: test-results.xml, testRunTitle: core }
  - stage: Build
    dependsOn: Verify
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - job: wheel
        steps:
          - script: pip install build && python -m build
          - publish: dist
            artifact: wheel
  # Databricks integration stage intentionally absent: DATABRICKS_INTEGRATION_PENDING (no workspace yet).
