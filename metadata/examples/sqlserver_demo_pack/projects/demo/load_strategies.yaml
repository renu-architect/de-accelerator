kind: load_strategy
items:
  # Incremental on ModifiedDate: re-reads the last hour (late commits) and reads 8 parallel partitions on OrderID.
  # First run loads everything; later runs load only what changed.
  # (late_arrival_window is rejected by the validator until it can use the source clock; rowversion watermarks are safe by design.)
  - object: orders
    load_type: INCREMENTAL
    watermark_column: ModifiedDate
    watermark_type: timestamp
    lookback_window: PT1H
    partition_column: OrderID
    num_partitions: 8
    schema_evolution_mode: ADD_COLUMNS
