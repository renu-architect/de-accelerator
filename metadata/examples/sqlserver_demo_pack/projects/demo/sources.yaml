# One SQL Server source. Every value that is a secret is a Key Vault reference (kv:<secret name>) — never a literal.
kind: source
items:
  - code: erp_sql
    source_type: sqlserver
    connector_type: jdbc
    auth_mode: SECRET
    connection: {host: "kv:erp-host", port: "1433", database: "kv:erp-db", user: "kv:erp-user", password: "kv:erp-pwd"}
    options: {fetchsize: 10000, max_connections: 4}
