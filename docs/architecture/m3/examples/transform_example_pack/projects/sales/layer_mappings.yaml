kind: layer_mapping
items:
  - {object: customers, layer: BRONZE, target_table: bronze.erp_customers, merge_type: APPEND}
  - {object: orders,    layer: BRONZE, target_table: bronze.erp_orders,    merge_type: APPEND}
  # Silver: SCD Type 2 dimension (history kept; logical-change identity drops duplicates, late arrivals are rejected)
  - object: customers
    layer: SILVER
    target_table: silver.customers
    merge_type: SCD2
    scd_columns: [Email, Country]                 # tracked attributes (source column names); a change opens a new version
    dedupe_keys: [CustomerID]
    dedupe_order: "ModifiedDate desc"
    effective_column: ModifiedDate                # v3: effective time of a version (default _ingest_ts)
    on_cast_error: REJECT                         # v3: REJECT (default) | FAIL
  # Silver: SCD Type 1 (latest state), incremental from the Bronze cursor
  - object: orders
    layer: SILVER
    target_table: silver.orders
    merge_type: SCD1
    dedupe_keys: [OrderID]
    dedupe_order: "ModifiedDate desc"
    effective_column: ModifiedDate
    on_cast_error: REJECT
  # Gold: fact = KEY_MERGE (upsert on business key), dimension = FULL (OVERWRITE)
  - {object: fact_sales,    layer: GOLD, target_table: gold.fact_sales,    merge_type: MERGE}
  - {object: dim_customer,  layer: GOLD, target_table: gold.dim_customer,  merge_type: OVERWRITE}
